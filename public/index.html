<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Groceries">
  <title>Groceries</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      font-size: 17px;
      line-height: 1.4;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* --- Header --- */
    .header {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .header-btn {
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }

    .header-btn:active {
      opacity: 0.7;
    }

    .header-btn.secondary {
      background: transparent;
      color: #007aff;
      padding: 10px 8px;
    }

    .back-btn {
      background: transparent;
      color: #007aff;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      padding: 10px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .back-btn:active {
      opacity: 0.7;
    }

    /* --- Screen container --- */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* --- Recipe list --- */
    .recipe-list {
      padding: 8px 0;
    }

    .recipe-item {
      background: #fff;
      margin: 0 12px 8px;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 64px;
    }

    .recipe-item:active {
      background: #f0f0f0;
    }

    .recipe-item.selected {
      background: #e8f4fd;
      border: 2px solid #007aff;
      padding: 14px 18px;
    }

    .recipe-check {
      width: 28px;
      height: 28px;
      border: 2px solid #ccc;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: transparent;
    }

    .recipe-item.selected .recipe-check {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .recipe-info {
      flex: 1;
    }

    .recipe-name {
      font-size: 17px;
      font-weight: 600;
    }

    .recipe-meta {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }

    /* --- Bottom action bar --- */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
      background: #fff;
      border-top: 1px solid #e0e0e0;
      z-index: 10;
    }

    .action-btn {
      width: 100%;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
    }

    .action-btn:active {
      opacity: 0.8;
    }

    .action-btn:disabled {
      background: #ccc;
      cursor: default;
    }

    .action-btn .sub {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.8;
      display: block;
      margin-top: 2px;
    }

    /* --- Ingredient list --- */
    .ingredient-list {
      padding: 8px 0 120px;
    }

    .category-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      padding: 16px 20px 6px;
    }

    .ingredient-item {
      background: #fff;
      margin: 0 12px 1px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      min-height: 52px;
    }

    .ingredient-item:first-of-type {
      border-radius: 12px 12px 0 0;
    }

    .ingredient-item:last-of-type {
      border-radius: 0 0 12px 12px;
      margin-bottom: 8px;
    }

    .ingredient-item:only-of-type {
      border-radius: 12px;
    }

    .ingredient-item:active {
      background: #f0f0f0;
    }

    .ing-checkbox {
      width: 26px;
      height: 26px;
      border: 2px solid #ccc;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: transparent;
    }

    .ingredient-item.checked .ing-checkbox {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .ingredient-item.staple {
      opacity: 0.5;
    }

    .ingredient-item.staple.checked {
      opacity: 1;
    }

    .ing-text {
      flex: 1;
      font-size: 17px;
    }

    .ing-qty {
      font-weight: 600;
    }

    .staple-label {
      font-size: 13px;
      color: #999;
      margin-left: 4px;
    }

    /* --- Loading / empty states --- */
    .loading, .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 17px;
    }

    .loading::after {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Sync status toast --- */
    .toast {
      position: fixed;
      top: 80px;
      left: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      z-index: 100;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: #d32f2f;
    }

    /* --- Order progress --- */
    .order-progress {
      padding: 20px 20px 8px;
    }

    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #007aff;
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 15px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    /* --- Order item list --- */
    .order-items {
      padding: 8px 0 120px;
    }

    .order-item {
      background: #fff;
      margin: 0 12px 1px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
    }

    .order-item:first-child { border-radius: 12px 12px 0 0; }
    .order-item:last-child { border-radius: 0 0 12px 12px; margin-bottom: 8px; }
    .order-item:only-child { border-radius: 12px; }

    .order-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      text-align: center;
      font-size: 16px;
      line-height: 24px;
    }

    .order-icon.searching { color: #007aff; }
    .order-icon.added { color: #34a853; }
    .order-icon.not-found { color: #d32f2f; }
    .order-icon.pending { color: #ccc; }

    .order-item-name {
      flex: 1;
      font-size: 16px;
    }

    .order-item-detail {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
    }

    /* --- Login prompt --- */
    .login-prompt {
      text-align: center;
      padding: 40px 20px;
    }

    .login-prompt p {
      font-size: 17px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* --- Order summary --- */
    .order-summary {
      padding: 20px;
    }

    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .summary-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .summary-card p {
      color: #888;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .summary-card .not-found-list {
      text-align: left;
      background: #fff3f3;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 15px;
      color: #d32f2f;
    }

    .summary-card .not-found-list div {
      padding: 4px 0;
    }

    .review-hint {
      font-size: 15px;
      color: #007aff;
      font-weight: 600;
      margin-top: 16px;
    }

    /* --- Cozi toggle badge --- */
    .cozi-toggle {
      background: #fff;
      margin: 8px 12px 0;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 56px;
      border: 2px solid #34a853;
    }

    .cozi-toggle.off {
      border-color: #ccc;
      opacity: 0.5;
    }

    .cozi-label {
      font-size: 17px;
      font-weight: 600;
      color: #34a853;
    }

    .cozi-toggle.off .cozi-label {
      color: #888;
    }

    .cozi-count {
      font-size: 15px;
      color: #888;
      font-weight: 400;
    }

    .cozi-check {
      width: 28px;
      height: 28px;
      border: 2px solid #34a853;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      background: #34a853;
    }

    .cozi-toggle.off .cozi-check {
      background: transparent;
      border-color: #ccc;
      color: transparent;
    }

    /* --- Cozi items in ingredient list --- */
    .cozi-source {
      font-size: 13px;
      color: #34a853;
      margin-left: 4px;
      font-weight: 500;
    }

    .category-header.cozi {
      color: #34a853;
    }

    /* Space for bottom bar on recipe screen */
    .recipe-list {
      padding-bottom: 100px;
    }
  </style>
</head>
<body>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <!-- Screen 1: Recipe Picker -->
  <div id="screen-picker" class="screen active">
    <div class="header">
      <h1>Groceries</h1>
      <button class="header-btn" id="sync-btn" onclick="syncRecipes()">Sync</button>
    </div>
    <div id="cozi-toggle" class="cozi-toggle" onclick="toggleCozi()" style="display:none">
      <div>
        <span class="cozi-label">Cozi List</span>
        <span class="cozi-count" id="cozi-count"></span>
      </div>
      <div class="cozi-check">&#10003;</div>
    </div>
    <div id="recipe-list" class="recipe-list">
      <div class="loading">Loading recipes</div>
    </div>
    <div class="action-bar">
      <button class="action-btn" id="review-btn" disabled onclick="showIngredients()">
        Review Ingredients
        <span class="sub" id="selected-count">Select recipes above</span>
      </button>
    </div>
  </div>

  <!-- Screen 2: Ingredient List -->
  <div id="screen-ingredients" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showPicker()">&#8592; Back</button>
      <h1>Ingredients</h1>
      <div style="width:60px"></div>
    </div>
    <div id="ingredient-list" class="ingredient-list">
      <div class="loading">Merging ingredients</div>
    </div>
    <div class="action-bar">
      <button class="action-btn" id="place-order-btn" onclick="placeOrder()">
        Place Order
        <span class="sub" id="order-sub">Review cart before checkout</span>
      </button>
    </div>
  </div>

  <!-- Screen 3: Order Status -->
  <div id="screen-order" class="screen">
    <div class="header">
      <button class="back-btn" id="order-back-btn" onclick="showIngredients()">&#8592; Back</button>
      <h1>Ordering</h1>
      <div style="width:60px"></div>
    </div>
    <div class="order-progress">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">Starting...</div>
    </div>
    <div id="order-items" class="order-items"></div>
    <div id="login-prompt" class="login-prompt" style="display:none">
      <p>Please log into Amazon in the browser window on your Mac, then tap the button below.</p>
      <button class="action-btn" onclick="continueOrder()">I've Logged In — Continue</button>
    </div>
    <div id="order-summary" class="order-summary" style="display:none"></div>
  </div>

  <script>
    // --- Config ---
    const API_KEY = "grocery-secret-key";
    const headers = { "X-API-Key": API_KEY, "Content-Type": "application/json" };

    // --- State ---
    let recipes = [];
    let selectedRecipes = new Set();
    let coziItems = [];
    let coziEnabled = true;
    let mergedItems = []; // flat list of all ingredients from merge
    let orderEventSource = null; // SSE connection for order updates

    // --- Screen switching ---
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      window.scrollTo(0, 0);
    }

    function showPicker() {
      showScreen("screen-picker");
    }

    function showIngredients() {
      showScreen("screen-ingredients");
      loadMergedIngredients();
    }

    // --- Toast ---
    function showToast(message, isError) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast visible" + (isError ? " error" : "");
      setTimeout(() => { toast.className = "toast"; }, 3000);
    }

    // --- Recipe Picker ---
    async function loadRecipes() {
      try {
        const res = await fetch("/recipes", { headers });
        const data = await res.json();
        recipes = data.recipes || [];
        renderRecipeList();
      } catch (err) {
        document.getElementById("recipe-list").innerHTML =
          '<div class="empty-state">Could not load recipes.<br>Is the server running?</div>';
      }
    }

    function renderRecipeList() {
      const list = document.getElementById("recipe-list");
      if (recipes.length === 0) {
        list.innerHTML = '<div class="empty-state">No recipes yet.<br>Tap Sync to pull from Google Doc.</div>';
        return;
      }

      list.innerHTML = recipes.map((r, i) => {
        const sel = selectedRecipes.has(r.name);
        return `
          <div class="recipe-item ${sel ? "selected" : ""}" data-index="${i}">
            <div class="recipe-check">${sel ? "&#10003;" : ""}</div>
            <div class="recipe-info">
              <div class="recipe-name">${esc(r.name)}</div>
              <div class="recipe-meta">${r.ingredientCount} ingredients</div>
            </div>
          </div>`;
      }).join("");

      // Use event delegation instead of inline onclick (avoids quote escaping issues)
      list.querySelectorAll(".recipe-item").forEach((el) => {
        el.addEventListener("click", () => {
          toggleRecipe(recipes[el.dataset.index].name);
        });
      });

      updateReviewButton();
    }

    function toggleRecipe(name) {
      if (selectedRecipes.has(name)) {
        selectedRecipes.delete(name);
      } else {
        selectedRecipes.add(name);
      }
      renderRecipeList();
    }

    function updateReviewButton() {
      const btn = document.getElementById("review-btn");
      const count = selectedRecipes.size;
      btn.disabled = count === 0;
      document.getElementById("selected-count").textContent =
        count === 0 ? "Select recipes above" : count + " selected";
    }

    // --- Sync ---
    async function syncRecipes() {
      const btn = document.getElementById("sync-btn");
      btn.disabled = true;
      btn.textContent = "Syncing...";
      try {
        const res = await fetch("/sync", { method: "POST", headers });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          await loadRecipes();
        } else {
          showToast(data.error || "Sync failed", true);
        }
      } catch (err) {
        showToast("Sync failed: " + err.message, true);
      }
      btn.disabled = false;
      btn.textContent = "Sync";
    }

    // --- Ingredient List ---
    async function loadMergedIngredients() {
      const list = document.getElementById("ingredient-list");
      list.innerHTML = '<div class="loading">Merging ingredients</div>';

      try {
        const res = await fetch("/merge", {
          method: "POST",
          headers,
          body: JSON.stringify({
            recipes: Array.from(selectedRecipes),
            includeCozi: coziEnabled,
          }),
        });
        const data = await res.json();
        renderIngredients(data.groups || []);
      } catch (err) {
        list.innerHTML = '<div class="empty-state">Failed to load ingredients.</div>';
      }
    }

    function renderIngredients(groups) {
      const list = document.getElementById("ingredient-list");
      if (groups.length === 0) {
        list.innerHTML = '<div class="empty-state">No ingredients found.</div>';
        return;
      }

      mergedItems = [];
      let idx = 0;
      let html = "";
      for (const group of groups) {
        const isCozi = group.items[0] && group.items[0].source === "cozi";
        html += `<div class="category-header${isCozi ? " cozi" : ""}">${esc(group.category)}</div>`;
        for (const item of group.items) {
          mergedItems.push(item);
          if (item.source === "cozi") {
            html += `
              <div class="ingredient-item checked" onclick="toggleIngredient(this)" data-idx="${idx}" data-cozi-item-id="${item.itemId}" data-cozi-list-id="${item.listId}">
                <div class="ing-checkbox">&#10003;</div>
                <div class="ing-text">
                  ${esc(item.name)}<span class="cozi-source">(Cozi)</span>
                </div>
              </div>`;
          } else {
            const checked = !item.isStaple;
            const cls = (checked ? "checked" : "") + (item.isStaple ? " staple" : "");
            const qtyStr = formatQty(item.qty, item.unit);
            html += `
              <div class="ingredient-item ${cls}" onclick="toggleIngredient(this)" data-idx="${idx}">
                <div class="ing-checkbox">${checked ? "&#10003;" : ""}</div>
                <div class="ing-text">
                  <span class="ing-qty">${qtyStr}</span> ${esc(item.name)}${item.isStaple ? '<span class="staple-label">(staple)</span>' : ""}
                </div>
              </div>`;
          }
          idx++;
        }
      }
      list.innerHTML = html;
      updatePlaceOrderButton();
    }

    function toggleIngredient(el) {
      el.classList.toggle("checked");
      const cb = el.querySelector(".ing-checkbox");
      cb.innerHTML = el.classList.contains("checked") ? "&#10003;" : "";
      updatePlaceOrderButton();
    }

    function updatePlaceOrderButton() {
      const checked = document.querySelectorAll("#ingredient-list .ingredient-item.checked").length;
      const btn = document.getElementById("place-order-btn");
      if (btn) {
        btn.disabled = checked === 0;
        document.getElementById("order-sub").textContent =
          checked === 0 ? "Check items to order" : checked + " items to order";
      }
    }

    function formatQty(qty, unit) {
      if (!qty) return "";
      const q = Number.isInteger(qty) ? qty : parseFloat(qty.toFixed(2));
      if (unit === "whole") return q;
      return q + " " + unit;
    }

    // --- Helpers ---
    function esc(str) {
      const el = document.createElement("span");
      el.textContent = str;
      return el.innerHTML;
    }

    // --- Cozi ---
    async function loadCoziCount() {
      try {
        const res = await fetch("/cozi", { headers });
        const data = await res.json();
        coziItems = data.items || [];
        const toggle = document.getElementById("cozi-toggle");
        const count = document.getElementById("cozi-count");
        if (coziItems.length > 0) {
          count.textContent = coziItems.length + " item" + (coziItems.length === 1 ? "" : "s");
          toggle.style.display = "flex";
        } else {
          toggle.style.display = "none";
        }
      } catch (err) {
        // Cozi not available — just hide the toggle
        document.getElementById("cozi-toggle").style.display = "none";
      }
    }

    function toggleCozi() {
      coziEnabled = !coziEnabled;
      const toggle = document.getElementById("cozi-toggle");
      const check = toggle.querySelector(".cozi-check");
      if (coziEnabled) {
        toggle.classList.remove("off");
        check.innerHTML = "&#10003;";
      } else {
        toggle.classList.add("off");
        check.innerHTML = "";
      }
    }

    // --- Ordering ---

    function placeOrder() {
      // Collect all checked items
      const checkedEls = document.querySelectorAll("#ingredient-list .ingredient-item.checked");
      const items = [];
      checkedEls.forEach((el) => {
        const idx = parseInt(el.dataset.idx);
        if (!isNaN(idx) && mergedItems[idx]) {
          items.push(mergedItems[idx]);
        }
      });

      if (items.length === 0) {
        showToast("No items checked", true);
        return;
      }

      // Switch to order screen
      showScreen("screen-order");
      resetOrderUI(items);
      startOrder(items);
    }

    function resetOrderUI(items) {
      document.getElementById("progress-fill").style.width = "0%";
      document.getElementById("progress-text").textContent = "Starting...";
      document.getElementById("login-prompt").style.display = "none";
      document.getElementById("order-summary").style.display = "none";
      document.getElementById("order-back-btn").onclick = function () {
        if (confirm("Stop the order and go back?")) {
          cancelOrder();
          showIngredients();
        }
      };

      // Render all items as pending
      let html = "";
      for (const item of items) {
        html += `
          <div class="order-item" id="order-item-${items.indexOf(item)}">
            <div class="order-icon pending">&#9679;</div>
            <div>
              <div class="order-item-name">${esc(item.name)}</div>
            </div>
          </div>`;
      }
      document.getElementById("order-items").innerHTML = html;
    }

    async function startOrder(items) {
      // Start the order on the server
      try {
        const res = await fetch("/order/start", {
          method: "POST",
          headers,
          body: JSON.stringify({ items }),
        });
        const data = await res.json();
        if (!data.success) {
          showToast(data.error || "Failed to start order", true);
          return;
        }
      } catch (err) {
        showToast("Server error: " + err.message, true);
        return;
      }

      // Open SSE connection for real-time updates
      openOrderSSE();
    }

    function openOrderSSE() {
      closeOrderSSE();
      orderEventSource = new EventSource("/order/events?key=" + encodeURIComponent(API_KEY));

      orderEventSource.addEventListener("status", (e) => {
        const data = JSON.parse(e.data);
        handleOrderStatus(data);
      });

      orderEventSource.addEventListener("item", (e) => {
        const data = JSON.parse(e.data);
        handleItemUpdate(data);
      });

      orderEventSource.onerror = () => {
        // SSE auto-reconnects, just log
        console.log("SSE connection error, reconnecting...");
      };
    }

    function closeOrderSSE() {
      if (orderEventSource) {
        orderEventSource.close();
        orderEventSource = null;
      }
    }

    async function cancelOrder() {
      closeOrderSSE();
      try {
        await fetch("/order/cancel", { method: "POST", headers });
      } catch (err) {
        // Best effort — server might already be done
        console.log("Cancel request failed:", err.message);
      }
    }

    function handleOrderStatus(data) {
      const progressText = document.getElementById("progress-text");
      progressText.textContent = data.message;

      if (data.phase === "login-needed") {
        document.getElementById("login-prompt").style.display = "block";
        document.getElementById("progress-fill").style.width = "0%";
      }

      if (data.phase === "ordering") {
        document.getElementById("login-prompt").style.display = "none";
      }

      if (data.phase === "complete") {
        document.getElementById("progress-fill").style.width = "100%";
        closeOrderSSE();
        showOrderSummary(data);
      }

      if (data.phase === "error") {
        document.getElementById("progress-fill").style.width = "0%";
        progressText.textContent = data.message;
        closeOrderSSE();
        // Let user go back freely
        document.getElementById("order-back-btn").onclick = function () {
          showIngredients();
        };
      }
    }

    function handleItemUpdate(data) {
      const el = document.getElementById("order-item-" + data.index);
      if (!el) return;

      const icon = el.querySelector(".order-icon");
      const nameDiv = el.querySelector(".order-item-name");

      if (data.status === "searching") {
        icon.className = "order-icon searching";
        icon.innerHTML = "&#8987;"; // hourglass
      } else if (data.status === "added") {
        icon.className = "order-icon added";
        icon.innerHTML = "&#10003;"; // checkmark
        if (data.product) {
          let detail = el.querySelector(".order-item-detail");
          if (!detail) {
            detail = document.createElement("div");
            detail.className = "order-item-detail";
            nameDiv.parentNode.appendChild(detail);
          }
          detail.textContent = data.product;
        }
      } else if (data.status === "not_found" || data.status === "error") {
        icon.className = "order-icon not-found";
        icon.innerHTML = "&#10007;"; // X mark
        let detail = el.querySelector(".order-item-detail");
        if (!detail) {
          detail = document.createElement("div");
          detail.className = "order-item-detail";
          nameDiv.parentNode.appendChild(detail);
        }
        detail.textContent = data.reason || "Not found";
      }

      // Update progress bar
      const pct = Math.round(((data.index + 1) / data.total) * 100);
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-text").textContent =
        `${data.index + 1} of ${data.total} items...`;
    }

    function showOrderSummary(data) {
      const summary = document.getElementById("order-summary");
      let html = '<div class="summary-card">';
      html += `<h2>${data.added} of ${data.total} Added</h2>`;
      html += `<p>Items have been added to your Amazon Whole Foods cart.</p>`;

      if (data.notFound && data.notFound.length > 0) {
        html += '<div class="not-found-list"><strong>Could not find:</strong>';
        for (const item of data.notFound) {
          html += `<div>&#8226; ${esc(item.name)}</div>`;
        }
        html += "</div>";
      }

      html += '<div class="review-hint">Go to your Mac to review the cart and check out.</div>';
      html += "</div>";
      summary.innerHTML = html;
      summary.style.display = "block";

      // Let user go back freely now
      document.getElementById("order-back-btn").onclick = function () {
        showIngredients();
      };
    }

    async function continueOrder() {
      document.getElementById("login-prompt").style.display = "none";
      document.getElementById("progress-text").textContent = "Checking login...";

      try {
        const res = await fetch("/order/continue", { method: "POST", headers });
        const data = await res.json();
        if (!data.success) {
          showToast(data.error || "Could not continue", true);
        }
      } catch (err) {
        showToast("Server error: " + err.message, true);
      }
    }

    // --- Init ---
    loadRecipes();
    loadCoziCount();
  </script>
</body>
</html>
